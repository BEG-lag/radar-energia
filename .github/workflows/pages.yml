name: Deploy site

# Publishes docs/ to GitHub Pages. Runs on pushes that touch the site and is also called
# by the update workflow, because commits pushed with GITHUB_TOKEN do not trigger other
# workflows.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # The artifacts API sometimes lists a just-uploaded artifact a few seconds late
      # ("No artifacts named github-pages were found"), and Pages itself sometimes answers
      # "Deployment failed, try again later". Wait before deploying and retry once.
      - name: Let the artifact settle
        run: sleep 15
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
